name: ModelBake release evidence
description: Build and compare a local open-model release record; uploads are opt-in.
author: ModelBake contributors

branding:
  icon: layers
  color: orange

inputs:
  recipe:
    description: Path to a validated ModelBake recipe in the checked-out repository.
    required: true
  run-directory:
    description: Fresh directory for this run.
    required: false
    default: .modelbake/runs/current
  cache-directory:
    description: Local digest-verifying ModelBake cache, ideally on a private persistent volume.
    required: false
    default: .modelbake/cache
  baseline-manifest:
    description: Deprecated; release review receipts require baseline-store.
    required: false
    default: ""
  baseline-artifact-root:
    description: Deprecated with baseline-manifest.
    required: false
    default: ""
  baseline-store:
    description: Required local accepted-baseline store used to bind the review predecessor.
    required: true
    default: ""
  baseline-name:
    description: Channel in baseline-store to compare against.
    required: false
    default: production
  initial-baseline:
    description: Set true only for the first reviewed release of an empty baseline channel.
    required: false
    default: "false"
  source-root:
    description: Trusted root for an absolute mounted source.path in the recipe.
    required: false
    default: ""
  enable-github-cache:
    description: Explicitly upload model/cache bytes to GitHub cache; review data rights and size first.
    required: false
    default: "false"
  upload-evidence:
    description: Explicitly upload manifests/reports, which can contain local paths or tool output.
    required: false
    default: "false"
  artifact-name:
    description: Name of the uploaded evidence bundle.
    required: false
    default: modelbake-release-evidence

outputs:
  manifest:
    description: Path to the recorded run manifest.
    value: ${{ steps.paths.outputs.manifest }}
  report:
    description: Path to the self-contained HTML report.
    value: ${{ steps.paths.outputs.report }}
  comparison:
    description: Path to the Markdown comparison when a baseline was supplied.
    value: ${{ steps.paths.outputs.comparison }}
  review:
    description: Immutable review receipt to consume with baseline accept --review.
    value: ${{ steps.paths.outputs.review }}

runs:
  using: composite
  steps:
    - name: Validate caller-controlled inputs
      shell: bash
      env:
        MODELBAKE_RECIPE: ${{ inputs.recipe }}
        MODELBAKE_RUN_DIR: ${{ inputs.run-directory }}
        MODELBAKE_CACHE_DIR: ${{ inputs.cache-directory }}
        MODELBAKE_BASELINE: ${{ inputs.baseline-manifest }}
        MODELBAKE_BASELINE_ROOT: ${{ inputs.baseline-artifact-root }}
        MODELBAKE_BASELINE_STORE: ${{ inputs.baseline-store }}
        MODELBAKE_BASELINE_NAME: ${{ inputs.baseline-name }}
        MODELBAKE_BASELINE_INITIAL: ${{ inputs.initial-baseline }}
        MODELBAKE_SOURCE_ROOT: ${{ inputs.source-root }}
        MODELBAKE_ARTIFACT_NAME: ${{ inputs.artifact-name }}
        MODELBAKE_REMOTE_CACHE: ${{ inputs.enable-github-cache }}
        MODELBAKE_UPLOAD_EVIDENCE: ${{ inputs.upload-evidence }}
      run: |
        python - <<'PY'
        import os
        for name, value in os.environ.items():
            if name.startswith("MODELBAKE_") and ("\r" in value or "\n" in value):
                raise SystemExit(f"{name} cannot contain a line break")
        if os.environ["MODELBAKE_REMOTE_CACHE"] not in {"true", "false"}:
            raise SystemExit("enable-github-cache must be exactly true or false")
        if os.environ["MODELBAKE_UPLOAD_EVIDENCE"] not in {"true", "false"}:
            raise SystemExit("upload-evidence must be exactly true or false")
        if os.environ["MODELBAKE_BASELINE_INITIAL"] not in {"true", "false"}:
            raise SystemExit("initial-baseline must be exactly true or false")
        if os.environ["MODELBAKE_BASELINE"] or os.environ["MODELBAKE_BASELINE_ROOT"]:
            raise SystemExit("baseline-manifest inputs are deprecated; use baseline-store")
        if not os.environ["MODELBAKE_BASELINE_STORE"]:
            raise SystemExit("baseline-store is required to create a release review receipt")
        PY

    - name: Restore ModelBake's verified byte cache
      if: ${{ inputs.enable-github-cache == 'true' }}
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ inputs.cache-directory }}
        key: modelbake-v0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(inputs.recipe) }}
        restore-keys: |
          modelbake-v0-${{ runner.os }}-${{ runner.arch }}-

    - name: Install the reviewed ModelBake action source
      shell: bash
      env:
        MODELBAKE_ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install "$MODELBAKE_ACTION_PATH"

    - name: Build the release record
      shell: bash
      env:
        MODELBAKE_RECIPE: ${{ inputs.recipe }}
        MODELBAKE_RUN_DIR: ${{ inputs.run-directory }}
        MODELBAKE_CACHE_DIR: ${{ inputs.cache-directory }}
        MODELBAKE_SOURCE_ROOT: ${{ inputs.source-root }}
      run: |
        args=(modelbake build "$MODELBAKE_RECIPE" --run-dir "$MODELBAKE_RUN_DIR" --cache-dir "$MODELBAKE_CACHE_DIR")
        if [[ -n "$MODELBAKE_SOURCE_ROOT" ]]; then
          args+=(--allow-source-root "$MODELBAKE_SOURCE_ROOT")
        fi
        "${args[@]}"

    - name: Verify recorded artifact bytes
      shell: bash
      env:
        MODELBAKE_MANIFEST: ${{ inputs.run-directory }}/manifest.json
        MODELBAKE_CACHE_DIR: ${{ inputs.cache-directory }}
      run: >-
        modelbake verify "$MODELBAKE_MANIFEST"
        --allow-artifact-root "$MODELBAKE_CACHE_DIR"

    - name: Render inspectable evidence
      shell: bash
      env:
        MODELBAKE_MANIFEST: ${{ inputs.run-directory }}/manifest.json
        MODELBAKE_REPORT: ${{ inputs.run-directory }}/report.html
      run: modelbake report "$MODELBAKE_MANIFEST" --html "$MODELBAKE_REPORT"

    - name: Create predecessor-bound release review
      shell: bash
      env:
        MODELBAKE_BASELINE_STORE: ${{ inputs.baseline-store }}
        MODELBAKE_BASELINE_NAME: ${{ inputs.baseline-name }}
        MODELBAKE_BASELINE_INITIAL: ${{ inputs.initial-baseline }}
        MODELBAKE_CACHE_DIR: ${{ inputs.cache-directory }}
        MODELBAKE_MANIFEST: ${{ inputs.run-directory }}/manifest.json
        MODELBAKE_COMPARISON: ${{ inputs.run-directory }}/comparison.md
        MODELBAKE_REVIEW: ${{ inputs.run-directory }}/review.json
      run: |
        args=(modelbake baseline review "$MODELBAKE_MANIFEST" --store "$MODELBAKE_BASELINE_STORE" --name "$MODELBAKE_BASELINE_NAME" --review "$MODELBAKE_REVIEW" --allow-artifact-root "$MODELBAKE_CACHE_DIR")
        if [[ "$MODELBAKE_BASELINE_INITIAL" == "true" ]]; then
          args+=(--initial)
        fi
        "${args[@]}"
        python - <<'PY'
        import json
        import os
        from pathlib import Path
        from modelbake.compare import render_comparison

        receipt = json.loads(Path(os.environ["MODELBAKE_REVIEW"]).read_text(encoding="utf-8"))
        comparison = receipt["comparison"]
        if comparison["schema"] == "modelbake.compare.initial.v1":
            rendered = "## ModelBake initial release review\n\nNo predecessor exists. Candidate artifact digests were live-verified; no quality or approval is inferred."
        else:
            rendered = render_comparison(comparison, markdown=True)
        Path(os.environ["MODELBAKE_COMPARISON"]).write_text(rendered + "\n", encoding="utf-8")
        PY
        cat "$MODELBAKE_COMPARISON" >> "$GITHUB_STEP_SUMMARY"

    - name: Write evidence paths
      id: paths
      shell: bash
      env:
        MODELBAKE_RUN_DIR: ${{ inputs.run-directory }}
      run: |
        echo "manifest=$MODELBAKE_RUN_DIR/manifest.json" >> "$GITHUB_OUTPUT"
        echo "report=$MODELBAKE_RUN_DIR/report.html" >> "$GITHUB_OUTPUT"
        echo "comparison=$MODELBAKE_RUN_DIR/comparison.md" >> "$GITHUB_OUTPUT"
        echo "review=$MODELBAKE_RUN_DIR/review.json" >> "$GITHUB_OUTPUT"

    - name: Stage the exact opt-in evidence set
      if: ${{ always() && inputs.upload-evidence == 'true' }}
      shell: bash
      env:
        MODELBAKE_RUN_DIR: ${{ inputs.run-directory }}
        MODELBAKE_UPLOAD_DIR: modelbake-release-upload-${{ github.run_id }}-${{ github.run_attempt }}
      run: |
        python - <<'PY'
        import hashlib
        import os
        import shutil
        import stat
        from pathlib import Path

        source = Path(os.environ["MODELBAKE_RUN_DIR"])
        destination = Path(os.environ["MODELBAKE_UPLOAD_DIR"])
        names = ("manifest.json", "report.html", "comparison.md", "review.json")
        if destination.exists() or destination.is_symlink() or destination.name.startswith("."):
            raise SystemExit("evidence staging directory must be new and non-hidden")
        destination.mkdir(mode=0o700)
        for name in names:
            path = source / name
            info = path.lstat()
            if not stat.S_ISREG(info.st_mode):
                raise SystemExit(f"evidence source is not a regular file: {path}")
            copied = destination / name
            shutil.copyfile(path, copied)
            if hashlib.sha256(path.read_bytes()).digest() != hashlib.sha256(copied.read_bytes()).digest():
                raise SystemExit(f"evidence copy changed bytes: {name}")
        if {path.name for path in destination.iterdir()} != set(names):
            raise SystemExit("staged evidence set is not exact")
        PY

    - name: Upload the release evidence
      if: ${{ always() && inputs.upload-evidence == 'true' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ inputs.artifact-name }}
        path: modelbake-release-upload-${{ github.run_id }}-${{ github.run_attempt }}/
        if-no-files-found: error
        retention-days: 30
