name: Publish ModelBake to PyPI

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PUBLISH MODELBAKE 0.1.0 TO PYPI
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-modelbake-0.1.0
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require the exact release confirmation
        env:
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$RELEASE_CONFIRMATION" != "PUBLISH MODELBAKE 0.1.0 TO PYPI" ]; then
            echo "Confirmation did not match the ModelBake 0.1.0 release." >&2
            exit 1
          fi
      - name: Check out the exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install release dependencies
        run: >-
          python -m pip install --upgrade pip &&
          python -m pip install '.[dev]' build ruff
      - name: Run the fail-closed release gate
        run: make release-check
      - name: Require the exact 0.1.0 distribution set
        run: |
          python - <<'PY'
          from pathlib import Path

          package_dir = Path("release-staging/packages")
          expected = {
              "modelbake_ai-0.1.0-py3-none-any.whl",
              "modelbake_ai-0.1.0.tar.gz",
          }
          actual = {path.name for path in package_dir.iterdir() if path.is_file()}
          if actual != expected:
              raise SystemExit(f"unexpected publish set: {sorted(actual)}")
          PY
      - name: Upload only the verified Python distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: modelbake-pypi-0.1.0
          path: release-staging/packages/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/modelbake-ai
    permissions:
      id-token: write
    steps:
      - name: Download the verified distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: modelbake-pypi-0.1.0
          path: dist/
      - name: Publish with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          print-hash: true
