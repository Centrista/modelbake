name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Run test suite
        run: pytest
      - name: Exercise deterministic demo
        run: |
          modelbake plan examples/modelbake.fixture.yaml
          modelbake demo --run-dir .modelbake/ci-demo --cache-dir .modelbake/ci-cache
          modelbake verify .modelbake/ci-demo/manifest.json --allow-artifact-root .modelbake/ci-cache
